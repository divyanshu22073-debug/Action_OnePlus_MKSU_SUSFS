name: Build OnePlus_SukiSU Ultra All
on:
  workflow_dispatch:
    inputs:
      CPU:
        type: choice
        description: "分支"
        required: true
        default: sm8550
        options:
          - sm7550
          - sm7675
          - sm8450
          - sm8475
          - sm8550
          - sm8650
          - sm8750
          - sm8850
      FEIL:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace2_pro_v
        options:
          - oneplus_nord_ce4_v
          - oneplus_ace_3v_v
          - oneplus_nord_4_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus12_v
          - oneplus_13r
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_pad2_v
          - oneplus_13
          - oneplus_13t
          - oneplus_ace5_pro
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_15
          - GitHub有bug可能不显示最后一项,误使用此项
      CPUD:
        type: choice
        description: "处理器代号"
        required: true
        default: kalama
        options:
          - crow
          - waipio
          - kalama
          - pineapple
          - sun
          - canoe
      ANDROID_VERSION:
        type: choice
        description: "内核安卓版本"
        required: true
        default: android15
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
      KERNEL_VERSION:
       type: choice
       description: "内核版本"
       required: true
       default: "5.15"
       options:
         - "5.10"
         - "5.15"
         - "6.1"
         - "6.6"
         - "6.12"
      BUILD_METHOD:
        type: choice
        description: "编译方式"
        required: true
        default: gki
        options:
          - gki
          - perf
      SUSFS_CI:
        type: boolean
        description: "下载SUSFS模块是否使用CI构建？"
        required: true
        default: true
      VFS:
        type: boolean
        description: "是否启用手动钩子？"
        required: true
        default: true
      KPM:
        type: boolean
        description: "是否启用KPM？"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "是否启用添加更多的ZRAM算法？"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Show selected inputs debug
        run: |
          echo "Selected CPU: ${{ github.event.inputs.CPU }}"
          echo "Selected FEIL: ${{ github.event.inputs.FEIL }}"
          echo "Selected CPUD: ${{ github.event.inputs.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ github.event.inputs.ANDROID_VERSION }}"
          echo "Selected KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ github.event.inputs.BUILD_METHOD }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected VFS: ${{ github.event.inputs.VFS }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          repo sync
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      # 删除 -dirty 后缀
      - name: Force remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i 's/ -dirty//g' msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          git add -A
          git commit -m "Force remove -dirty suffix from kernel version"

      # 添加 SukiSU Ultra
      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "正在给内核打susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          echo "正在给内核打zram补丁"
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch || true

          # --- STEP 1: SUSFS compile-layer fixes (MUST run AFTER the susfs patch) ---
          # --- 1a. SUSFS include fix for mm/memory.c ----------------------------------
          # The susfs patch hunk #1 inserts '#include <linux/susfs_def.h>' right after
          # '#include <linux/vmalloc.h>'. On the oplus tree the surrounding include
          # context drifts, so hunk #1 is rejected and the file later fails -Werror
          # with implicit declarations (SUSFS_IS_INODE_SUS_MAP). Re-do the insertion
          # deterministically after the patch has run:
          if ! grep -q "linux/susfs_def.h" mm/memory.c; then
            sed -i '/#include <linux\/vmalloc.h>/a #include <linux/susfs_def.h>' mm/memory.c
          fi

          # --- 1b. -Werror=maybe-uninitialized fix for fs/proc/task_mmu.c -------------
          # The susfs show_map_vma() changes add 'struct dentry *dentry;', which clang
          # -Werror flags as (sometimes-)uninitialized. Initialize it to NULL (idempotent):
          sed -i 's/struct dentry \*dentry;/struct dentry *dentry = NULL;/g' fs/proc/task_mmu.c || true

          echo "=== SUSFS fix-up verification ==="
          grep -n "linux/susfs_def.h" mm/memory.c || echo "WARNING: susfs_def.h include still missing in mm/memory.c"
          grep -n "struct dentry \*dentry = NULL;" fs/proc/task_mmu.c || echo "NOTE: no dentry declaration to initialize in task_mmu.c"
          echo "完成"

      - name: Apply Hide Stuff Patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Apply LZ4KD
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
            echo "正在打lz4kd补丁"
            patch -p1 -F 3 < lz4kd.patch || true
            echo '完成LZ4KD补丁'
          fi

      # 配置信息
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ github.event.inputs.KERNEL_VERSION }}"

          # SukiSU Ultra config
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

          # --- STEP 3: Kconfig symbol management (KPM + stale-symbol cleanup) ---
          # --- 3a. KPM (SukiSU Kernel Patch Module) ------------------------------------
          # Official SukiSU-Ultra requirement: CONFIG_KPM=y (KALLSYMS is already on in
          # GKI). The symbol only exists AFTER the SukiSU/KPM kernel patches have been
          # applied, so this must run after patching and before the build:
          if [ "${{ github.event.inputs.KPM }}" = "true" ]; then
            grep -q "^CONFIG_KPM=" "$CONFIG_FILE" || echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          fi

          # SUSFS config
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # --- 3b. Remove stale SUSFS magic-mount symbol -------------------------------
          # SUSFS v1.5.2+ no longer defines CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT; leaving it
          # in the defconfig only produces kconfig warnings on every build:
          sed -i '/CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT/d' "$CONFIG_FILE"

          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

          # LZ4KD配置
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
              echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZO=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.12" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "5.10" ]; then
              if grep -q "CONFIG_ZSMALLOC" -- "$CONFIG_FILE"; then
                sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
              else
                echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              fi
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.12" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android16" ]; then
              if [  -e ./common/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
              fi

              if [  -e ./msm-kernel/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
                echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
                echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
              fi
              
              echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
              rm "common/android/gki_aarch64_modules"
              touch "common/android/gki_aarch64_modules"
            fi

            if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
              echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
            fi
          fi

          # =====================================================================
          # STEP 4: Performance configuration injection (verified 5.15 symbols ONLY)
          # Every symbol below exists in the Linux 5.15 Kconfig sources and in the
          # OnePlusOSS sm7550 tree. All echoes are guarded so re-runs are idempotent.
          # =====================================================================
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          # --- 4a. Network: BBR + FQ ----------------------------------------------------
          # TCP_CONG_BBR lives inside 'if TCP_CONG_ADVANCED' in 5.15 — the gate is
          # MANDATORY or kconfig silently drops BBR:
          grep -q "^CONFIG_TCP_CONG_ADVANCED=" "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_TCP_CONG_BBR="       "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_BBR=y"       >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_BBR="        "$CONFIG_FILE" || echo "CONFIG_DEFAULT_BBR=y"        >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_TCP_CONG="   "$CONFIG_FILE" || echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$CONFIG_FILE"
          # FQ pacing qdisc (already =y in this tree's gki_defconfig; kept as ensure):
          grep -q "^CONFIG_NET_SCH_FQ="         "$CONFIG_FILE" || echo "CONFIG_NET_SCH_FQ=y"         >> "$CONFIG_FILE"
          # Make FQ the system default qdisc (valid 5.15 symbols:
          # NET_SCH_DEFAULT + DEFAULT_FQ -> DEFAULT_NET_SCH="fq"):
          grep -q "^CONFIG_NET_SCH_DEFAULT="    "$CONFIG_FILE" || echo "CONFIG_NET_SCH_DEFAULT=y"    >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_FQ="         "$CONFIG_FILE" || echo "CONFIG_DEFAULT_FQ=y"         >> "$CONFIG_FILE"
          # NOTE: there is NO ECN Kconfig symbol in 5.15 (CONFIG_IP_ECN is invalid).
          # ECN is unconditionally compiled and runtime-controlled via sysctl
          # net.ipv4.tcp_ecn. Do NOT echo any ECN config line.

          # --- 4b. GPU devfreq (mainline governors only) --------------------------------
          # The Adreno-720 KGSL driver and the MSM_ADRENO_TZ governor are built from the
          # vendor modules side with stock fragments; CONFIG_MSM_KGSL /
          # CONFIG_DEVFREQ_GOV_MSM_ADRENO_TZ do not exist in the GKI kernel tree.
          # Ensure the mainline governors instead — SIMPLE_ONDEMAND is the one KGSL
          # falls back to and is missing from the tree's gki_defconfig:
          grep -q "^CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=" "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEVFREQ_GOV_PERFORMANCE="     "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y"     >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEVFREQ_GOV_USERSPACE="       "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_USERSPACE=y"       >> "$CONFIG_FILE"

          # --- 4c. ZRAM: default compressor (5.15-correct method) -----------------------
          # The 5.15 zram driver reads CONFIG_ZRAM_DEF_COMP from a real Kconfig choice.
          # Set LZ4 unless the LZ4KD workflow path already selected a choice member
          # (ZRAM_DEF_COMP is a choice — two members would just conflict):
          grep -q "^CONFIG_ZRAM="              "$CONFIG_FILE" || echo "CONFIG_ZRAM=y"              >> "$CONFIG_FILE"
          grep -q "^CONFIG_CRYPTO_LZ4="        "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4=y"        >> "$CONFIG_FILE"
          grep -q "^CONFIG_CRYPTO_LZ4HC="      "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4HC=y"      >> "$CONFIG_FILE"
          if ! grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4KD=y" "$CONFIG_FILE"; then
            grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4=" "$CONFIG_FILE" || echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> "$CONFIG_FILE"
          fi
          grep -q "^CONFIG_ZRAM_WRITEBACK="    "$CONFIG_FILE" || echo "CONFIG_ZRAM_WRITEBACK=y"    >> "$CONFIG_FILE"

          # --- 4d. Scheduler: utilization clamping --------------------------------------
          # Already =y in this tree's gki_defconfig; kept as idempotent ensures:
          grep -q "^CONFIG_UCLAMP_TASK="       "$CONFIG_FILE" || echo "CONFIG_UCLAMP_TASK=y"       >> "$CONFIG_FILE"
          grep -q "^CONFIG_UCLAMP_TASK_GROUP=" "$CONFIG_FILE" || echo "CONFIG_UCLAMP_TASK_GROUP=y" >> "$CONFIG_FILE"

          # --- 4e. I/O scheduler ---------------------------------------------------------
          # Valid 5.15 symbol (mainline default y); coexists with the tree's BFQ:
          grep -q "^CONFIG_MQ_IOSCHED_KYBER="  "$CONFIG_FILE" || echo "CONFIG_MQ_IOSCHED_KYBER=y" >> "$CONFIG_FILE"

          # --- 4f. Compiler / allocator ---------------------------------------------------
          # This tree's gki_defconfig pins CONFIG_LTO_CLANG_FULL=y. LTO level is a
          # Kconfig choice, so DELETE FULL before appending THIN (large CI speedup):
          sed -i '/^CONFIG_LTO_CLANG_FULL=y/d' "$CONFIG_FILE"
          grep -q "^CONFIG_LTO_CLANG_THIN="    "$CONFIG_FILE" || echo "CONFIG_LTO_CLANG_THIN=y"   >> "$CONFIG_FILE"
          # SLUB debug support off (valid 5.15 symbol; the runtime slub_debug= param
          # then becomes a no-op, which is the intent):
          grep -q "^CONFIG_SLUB_DEBUG="        "$CONFIG_FILE" || echo "CONFIG_SLUB_DEBUG=n"       >> "$CONFIG_FILE"
          # DEBUG_INFO: the tree base sets DEBUG_INFO=y + DWARF4 + DEBUG_INFO_BTF=y and
          # the oplus fragment already adds DEBUG_INFO_REDUCED=y. Turning DEBUG_INFO off
          # also kills BTF, which breaks the Android bpfloader / tethering offload on
          # Android 13+ ROMs. RECOMMENDED: leave debug info untouched (the flashable
          # Image contains no DWARF anyway — only vmlinux and .ko files do).
          # Only if you explicitly accept the bpfloader risk, uncomment the next line:
          # sed -i '/^CONFIG_DEBUG_INFO=y/d;/^CONFIG_DEBUG_INFO_DWARF4=y/d;/^CONFIG_DEBUG_INFO_BTF=y/d' "$CONFIG_FILE" && echo "# CONFIG_DEBUG_INFO is not set" >> "$CONFIG_FILE"
          # NTSYNC: does NOT exist in 5.15 (merged upstream in 6.7 under drivers/misc).
          # Only meaningful for Wine/Winlator users and only after an explicit backport
          # of the ntsync driver into this tree. Guarded no-op otherwise:
          if [ -d ./common/drivers/misc/ntsync ] || [ -d ./common/fs/ntsync ]; then
            grep -q "^CONFIG_NTSYNC=" "$CONFIG_FILE" || echo "CONFIG_NTSYNC=y" >> "$CONFIG_FILE"
          fi

          echo "=== Injected defconfig tail (audit) ==="
          grep -nE "CONFIG_KPM|CONFIG_TCP_CONG|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEVFREQ_GOV|CONFIG_ZRAM|CONFIG_CRYPTO_LZ4|CONFIG_UCLAMP|CONFIG_MQ_IOSCHED_KYBER|CONFIG_LTO_CLANG|CONFIG_SLUB_DEBUG|CONFIG_NTSYNC" "$CONFIG_FILE" || true

      - name: Build kernel
        if: ${{ github.event.inputs.CPU == 'sm8650' || github.event.inputs.CPU == 'sm7675' }}
        run: |
          # STEP 2: GitHub Actions' default `bash -e {0}` does NOT enable pipefail.
          # Without it `... 2>&1 | tee build.log` returns tee's exit code (0) and
          # the job reports success on a dead build. Make the pipeline fail through.
          set -o pipefail
          cd kernel_workspace
          ./kernel_platform/build_with_bazel.py -t ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }} 2>&1 | tee build.log

      - name: Fallback build kernel
        if: ${{ github.event.inputs.CPU != 'sm8650' && github.event.inputs.CPU != 'sm7675' }}
        run: |
          # STEP 2: GitHub Actions' default `bash -e {0}` does NOT enable pipefail.
          # Without it `... 2>&1 | tee build.log` returns tee's exit code (0) and
          # the job reports success on a dead build. Make the pipeline fail through.
          set -o pipefail
          cd kernel_workspace
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }} 2>&1 | tee build.log

          # oplus_build_kernel.sh's interactive menu swallows non-zero exit codes in
          # some paths (the failed run above logged 'make ... Error 2' and still
          # printed the 'build total time' banner). Fail explicitly on compiler errors
          # so a dead build never reaches packaging:
          if grep -qE "^(source/)?[A-Za-z0-9_./-]+\.[ch]:[0-9]+:[0-9]+: error:|\*\*\* \[.*\] Error [0-9]+" build.log; then
            echo "::error::Kernel compilation errors detected in build.log — failing the job."
            grep -nE "error:|\*\*\* \[.*\] Error [0-9]+" build.log | head -n 40
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          # STEP 5: dynamic Image discovery. Never hardcode an out-dir path: the
          # oplus build script silently remaps unknown CPUD values (e.g. crow ->
          # "auto select platform kalama"), so out/msm-kernel-<CPUD>-<method> may
          # not exist even after a successful build.
          IMAGE_SRC=""
          # Tier 1: bazel/kleaf dist directories (the normal oplus kernel_platform layout)
          IMAGE_SRC=$(find kernel_workspace/kernel_platform/out -type f -name Image -path "*dist*" 2>/dev/null | head -n 1)
          # Tier 2: anywhere under the kernel_platform out/ tree
          if [ -z "$IMAGE_SRC" ]; then
            IMAGE_SRC=$(find kernel_workspace/kernel_platform/out -type f -name Image 2>/dev/null | head -n 1)
          fi
          # Tier 3: classic OBJ layout anywhere in the workspace
          if [ -z "$IMAGE_SRC" ]; then
            IMAGE_SRC=$(find kernel_workspace -type f -name Image -path "*arm64/boot*" 2>/dev/null | head -n 1)
          fi

          if [ -n "$IMAGE_SRC" ] && [ -s "$IMAGE_SRC" ]; then
            cp "$IMAGE_SRC" ./AnyKernel3/Image
            echo "Successfully found and copied kernel Image from: $IMAGE_SRC ($(du -h "$IMAGE_SRC" | cut -f1))"
          else
            echo "ERROR: Kernel Image binary not found in any out/ tree! Failing the job instead of shipping an empty zip."
            exit 1
          fi

          # Export the discovered dist directory for later steps (KPM patch_linux, audit)
          DIST_DIR="$(dirname "$IMAGE_SRC")"
          echo "IMAGE_SRC=$IMAGE_SRC" >> $GITHUB_ENV
          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

          # 可选复制其它新文件（如果存在）
          if [ "${{ github.event.inputs.CPU }}" = "sm8750" ] || [ "${{ github.event.inputs.CPU }}" = "sm8850" ]; then
          for file in dtbo.img system_dlkm.erofs.img vendor_dlkm.img vendor_boot.img; do
            if [ -f "$DIST_DIR/$file" ]; then
              target_name="$file"
              # 特殊处理 system_dlkm.erofs.img 的目标名
              if [ "$file" = "system_dlkm.erofs.img" ]; then
                target_name="system_dlkm.img"
              fi
              cp "$DIST_DIR/$file" "./AnyKernel3/$target_name"
            else
              echo "$file 不存在，跳过复制"
            fi
          done
          fi

      - name: Apply patch_linux and replace Image
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          # Use the dist directory discovered dynamically in "Make AnyKernel3"
          # (no hardcoded kalama/crow path, no hardcoded runner workspace path).
          if [ -z "$DIST_DIR" ] || [ ! -f "$DIST_DIR/Image" ]; then
            echo "ERROR: DIST_DIR not set or Image missing (DIST_DIR='$DIST_DIR')"
            exit 1
          fi
          cd "$DIST_DIR"

          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          if [ ! -s oImage ]; then
            echo "ERROR: patch_linux did not produce oImage"
            exit 1
          fi
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image
          echo "KPM-patched Image installed ($(du -h Image | cut -f1))"

      # 下载 SUSFS 模块（CI）
      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'true' }}
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
            exit 1
          fi

          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')

          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs.zip "$ARTIFACT_URL"
          cp ksu_module_susfs.zip ./AnyKernel3/

      # 下载 SUSFS 模块（Release）
      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'false' }}
        run: |
          # STEP 6: unify naming — both CI and Release paths deliver ./AnyKernel3/ksu_module_susfs.zip
          wget -O ksu_module_susfs.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs.zip ./AnyKernel3/

      # STEP 7: post-build verification of the config the build actually consumed
      - name: Verify applied kernel config
        run: |
          OUT_CONFIG=$(find kernel_workspace/kernel_platform/out -name ".config" -path "*msm-kernel*" 2>/dev/null | head -n 1)
          if [ -z "$OUT_CONFIG" ]; then
            OUT_CONFIG=$(find kernel_workspace/kernel_platform/out -name ".config" 2>/dev/null | head -n 1)
          fi
          if [ -n "$OUT_CONFIG" ]; then
            echo "Auditing: $OUT_CONFIG"
            echo "=== Applied config audit ==="
            grep -E "CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ|CONFIG_DEFAULT_NET_SCH|CONFIG_ZRAM_DEF_COMP|CONFIG_UCLAMP_TASK|CONFIG_MQ_IOSCHED_KYBER|CONFIG_LTO_CLANG|CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND|CONFIG_SLUB_DEBUG" "$OUT_CONFIG" || true
            echo "=== KSU / SUSFS state ==="
            grep -E "^CONFIG_KSU" "$OUT_CONFIG" || echo "WARNING: no CONFIG_KSU symbols in .config"
            echo "=== KPM state ==="
            grep -E "CONFIG_KPM" "$OUT_CONFIG" || echo "KPM not enabled (input off or symbol absent)"
          else
            echo "No .config found under kernel_platform/out — skipping audit"
          fi
          echo "=== AnyKernel3 payload ==="
          ls -la ./AnyKernel3/

      - name: Set suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.KPM == 'true' && '_KPM' || '' }}${{ github.event.inputs.VFS == 'true' && '_VFS' || '' }}${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}" >> $GITHUB_OUTPUT

      - name: Remove _uv suffix from FEIL
        id: feil_clean
        run: |
          clean_feil="${{ github.event.inputs.FEIL }}"
          clean_feil="${clean_feil%_v}"  # 去掉结尾的 _v（如果有）
          clean_feil="${clean_feil%_u}"  # 去掉结尾的 _u（如果有）
          echo "value=$clean_feil" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.feil_clean.outputs.value }}${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
