name: Build OnePlus_SukiSU Ultra All
on:
  workflow_dispatch:
    inputs:
      CPU:
        type: choice
        description: "分支"
        required: true
        default: sm8550
        options:
          - sm7550
          - sm7675
          - sm8450
          - sm8475
          - sm8550
          - sm8650
          - sm8750
          - sm8850
      FEIL:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace2_pro_v
        options:
          - oneplus_nord_ce4_v
          - oneplus_ace_3v_v
          - oneplus_nord_4_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus12_v
          - oneplus_13r
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_pad2_v
          - oneplus_13
          - oneplus_13t
          - oneplus_ace5_pro
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_15
          - GitHub有bug可能不显示最后一项,误使用此项
      CPUD:
        type: choice
        description: "处理器代号"
        required: true
        default: kalama
        options:
          - crow
          - waipio
          - kalama
          - pineapple
          - sun
          - canoe
      ANDROID_VERSION:
        type: choice
        description: "内核安卓版本"
        required: true
        default: android15
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
      KERNEL_VERSION:
       type: choice
       description: "内核版本"
       required: true
       default: "5.15"
       options:
         - "5.10"
         - "5.15"
         - "6.1"
         - "6.6"
         - "6.12"
      BUILD_METHOD:
        type: choice
        description: "编译方式"
        required: true
        default: gki
        options:
          - gki
          - perf
      SUSFS_CI:
        type: boolean
        description: "下载SUSFS模块是否使用CI构建？"
        required: true
        default: true
      VFS:
        type: boolean
        description: "是否启用手动钩子？"
        required: true
        default: true
      KPM:
        type: boolean
        description: "是否启用KPM？"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "是否启用添加更多的ZRAM算法？"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Show selected inputs debug
        run: |
          echo "Selected CPU: ${{ github.event.inputs.CPU }}"
          echo "Selected FEIL: ${{ github.event.inputs.FEIL }}"
          echo "Selected CPUD: ${{ github.event.inputs.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ github.event.inputs.ANDROID_VERSION }}"
          echo "Selected KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ github.event.inputs.BUILD_METHOD }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected VFS: ${{ github.event.inputs.VFS }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"

      - name: Validate inputs (susfs branch must exist)
        run: |
          BR="gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}"
          AVAIL=$(git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git | awk '{print $2}' | sed 's#refs/heads/##' | grep '^gki-' | grep -v -- '-dev$' | sort | tr '\n' ' ')
          if ! echo " $AVAIL" | grep -q " $BR "; then
            echo "::error::susfs4ksu has no branch '$BR'. ANDROID_VERSION/KERNEL_VERSION combination is invalid."
            echo "Valid combinations: $AVAIL"
            echo "For OnePlus Nord CE4 (sm7550, 5.15) use ANDROID_VERSION=android14 (kernel branch is android14-5.15)."
            exit 1
          fi
          echo "susfs branch OK: $BR"

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          repo sync
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      # 删除 -dirty 后缀
      - name: Force remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i 's/ -dirty//g' msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          git add -A
          git commit -m "Force remove -dirty suffix from kernel version"

      # 添加 SukiSU Ultra
      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          # Align KSUVER with the SukiSU Makefile's own version formula when present
          # (v4.x layout: VERSION_BASE + <commits on main> - VERSION_OFFSET, e.g.
          #  40000 + N - 2815; legacy layout fallback: N + 10606). Without this the
          # artifact name (KSUVER) and the in-kernel version banner disagree.
          KSU_COUNT=$(/usr/bin/git rev-list --count main 2>/dev/null || echo 0)
          VB=$(sed -n 's/^VERSION_BASE[[:space:]]*:=[[:space:]]*\([0-9]*\).*/\1/p' kernel/Makefile | head -n1)
          VO=$(sed -n 's/^VERSION_OFFSET[[:space:]]*:=[[:space:]]*\([0-9]*\).*/\1/p' kernel/Makefile | head -n1)
          if [ -n "$VB" ] && [ -n "$VO" ] && [ "$KSU_COUNT" -gt 0 ]; then
            KSU_VERSION=$((VB + KSU_COUNT - VO))
          else
            KSU_VERSION=$((KSU_COUNT + 10606))
          fi
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

          # --- FIX: restore ksu_handle_post_execveat_sucompat for the susfs4ksu kernel patch ---
          # susfs4ksu's 50_add_susfs_in_gki-*.patch makes do_execveat_common() in fs/exec.c
          # call ksu_handle_post_execveat_sucompat() under CONFIG_KSU_SUSFS (introduced as a
          # direct ksu_install_su_fd() call in commit b70ff734 on 2026-09-06, refactored into
          # the hook in 53869d88 on 2026-09-12). Vanilla KernelSU receives that symbol from
          # susfs4ksu's companion patch KernelSU/10_enable_susfs_for_ksu.patch, where it
          # installs the su-session fd after a successful su exec. SukiSU-Ultra's 'builtin'
          # branch has native SUSFS support but no su-fd mechanism (the root profile is
          # applied pre-exec via escape_with_root_profile()), so it never defined the hook:
          #   ld.lld: error: undefined symbol: ksu_handle_post_execveat_sucompat
          #   >>> referenced by exec.c:2006 (source/fs/exec.c:2006)
          # Correct fix for SukiSU: an intentional no-op shim. It must stay cheap because
          # SukiSU's ksu_handle_execveat_sucompat() always returns 0, so the patched exec.c
          # flags EVERY execveat as an su session and calls the post hook on every success.
          # The shim is appended to the sucompat translation unit, which works with both the
          # v4.x unity build (ksu.c #includes feature/sucompat.c) and the legacy multi-object
          # layout (sucompat.o). Idempotent, and self-disables if SukiSU ever ships the hook.
          SHIM_HOST=""
          for cand in kernel/feature/sucompat.c kernel/sucompat.c; do
            if [ -f "$cand" ]; then SHIM_HOST="$cand"; break; fi
          done
          if [ -z "$SHIM_HOST" ]; then
            echo "::error::No sucompat.c found in the SukiSU tree - cannot install the post_execveat shim. Upstream layout changed; update the workflow."
            exit 1
          fi
          if grep -rq "ksu_handle_post_execveat_sucompat" kernel/; then
            echo "ksu_handle_post_execveat_sucompat already provided natively - shim skipped"
          else
            cat >> "$SHIM_HOST" <<'SHIM_EOF'

          /* --- CI shim: susfs4ksu kernel-patch compatibility (added by workflow) ---
           * Referenced from do_execveat_common() in fs/exec.c (50_add_susfs_in_gki-*.patch)
           * under CONFIG_KSU_SUSFS. Vanilla KernelSU installs the su-session fd here after
           * a successful su exec; SukiSU-Ultra finalizes su sessions inside
           * ksu_handle_execveat_sucompat() (escape_with_root_profile) and has no su-fd
           * mechanism, so this hook is intentionally a no-op. Keep it cheap: with SukiSU
           * it runs on every successful execveat.
           */
          #ifdef CONFIG_KSU_SUSFS
          int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr,
                          void *argv_user, void *envp_user,
                          int *__never_use_flags, int *retval)
          {
              (void)fd;
              (void)filename_ptr;
              (void)argv_user;
              (void)envp_user;
              (void)__never_use_flags;
              (void)retval;
              return 0;
          }
          #endif
          SHIM_EOF
            echo "post_execveat shim appended to $SHIM_HOST"
          fi
          echo "=== shim verification ==="
          grep -n "ksu_handle_post_execveat_sucompat" "$SHIM_HOST" || { echo "::error::shim installation failed"; exit 1; }

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "正在给内核打susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          echo "正在给内核打zram补丁"
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch || true

          # --- STEP 1: SUSFS compile-layer fixes (MUST run AFTER the susfs patch) ---
          # --- 1a. SUSFS include fix for mm/memory.c ----------------------------------
          # The susfs patch hunk #1 inserts '#include <linux/susfs_def.h>' right after
          # '#include <linux/vmalloc.h>'. On the oplus tree the surrounding include
          # context drifts, so hunk #1 is rejected and the file later fails -Werror
          # with implicit declarations (SUSFS_IS_INODE_SUS_MAP). Re-do the insertion
          # deterministically after the patch has run:
          if ! grep -q "linux/susfs_def.h" mm/memory.c; then
            sed -i '/#include <linux\/vmalloc.h>/a #include <linux/susfs_def.h>' mm/memory.c
          fi

          # --- 1b. -Werror=maybe-uninitialized fix for fs/proc/task_mmu.c -------------
          # Idempotent safety net. NOTE: the 'struct dentry *dentry;' declaration is
          # actually introduced by 69_hide_stuff.patch (next step), so the real fix
          # lives in "Apply Hide Stuff Patches" (susfs-aware merge). Kept here so a
          # re-run on an already-patched tree stays clean:
          sed -i 's/struct dentry \*dentry;/struct dentry *dentry = NULL;/g' fs/proc/task_mmu.c || true

          echo "=== SUSFS fix-up verification ==="
          grep -n "linux/susfs_def.h" mm/memory.c || echo "WARNING: susfs_def.h include still missing in mm/memory.c"
          if [ -f mm/memory.c.rej ]; then
            echo "mm/memory.c.rej present (expected: hunk #1 include-context drift, fixed by 1a):"; cat mm/memory.c.rej
          fi
          for r in $(find . -name '*.rej' -not -path './mm/memory.c.rej' 2>/dev/null); do
            echo "::warning::Unexpected susfs reject: $r"; cat "$r"
          done
          echo "完成"

      - name: Apply Hide Stuff Patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"

          # 69_hide_stuff.patch touches two files:
          #   fs/proc/task_mmu.c  -> its hunk #3 was written against a tree WITHOUT
          #                          susfs. On the susfs-patched show_map_vma() it
          #                          only applies with fuzz 3 and lands INSIDE the
          #                          susfs OPEN_REDIRECT block, producing broken
          #                          control flow and the -Werror
          #                          'dentry is used uninitialized' failure.
          #   fs/proc/base.c      -> applies cleanly; keep using patch(1) for it.
          # So: apply base.c with patch, and do task_mmu.c with an anchor-based
          # merge that is aware of the susfs layout (verified against the real
          # OnePlusOSS sm7550 tree + susfs gki-android14-5.15).
          awk '/^--- a\/fs\/proc\/base\.c/{p=1} p' 69_hide_stuff.patch > 69_hide_stuff_base_only.patch
          if [ -s 69_hide_stuff_base_only.patch ]; then
            patch -p1 -N -F 3 < 69_hide_stuff_base_only.patch || echo "base.c hunk already applied"
          else
            echo "::warning::could not split base.c hunk out of 69_hide_stuff.patch; applying whole patch"
            patch -p1 -F 3 < 69_hide_stuff.patch || true
          fi

          python3 - <<'PY'
          import sys
          p = "fs/proc/task_mmu.c"
          s = open(p).read()
          if "show_vma_header_prefix_fake" in s:
              print("hide_stuff task_mmu.c already merged, skipping"); sys.exit(0)

          helper = (
              "static void show_vma_header_prefix_fake(struct seq_file *m,\n"
              "\t\t\t\t\tunsigned long start, unsigned long end,\n"
              "\t\t\t\t\tvm_flags_t flags, unsigned long long pgoff,\n"
              "\t\t\t\t\tdev_t dev, unsigned long ino)\n"
              "{\n"
              "\tseq_setwidth(m, 25 + sizeof(void *) * 6 - 1);\n"
              "\tseq_printf(m, \"%08lx-%08lx %c%c%c%c %08llx %02x:%02x %lu \",\n"
              "\t\t\tstart,\n"
              "\t\t\tend,\n"
              "\t\t\tflags & VM_READ ? 'r' : '-',\n"
              "\t\t\tflags & VM_WRITE ? 'w' : '-',\n"
              "\t\t\tflags & VM_EXEC ? '-' : '-',\n"
              "\t\t\tflags & VM_MAYSHARE ? 's' : 'p',\n"
              "\t\t\tpgoff,\n"
              "\t\t\tMAJOR(dev), MINOR(dev), ino);\n"
              "}\n\n"
          )
          a1 = "static void\nshow_map_vma(struct seq_file *m, struct vm_area_struct *vma)\n{\n"
          assert s.count(a1) == 1, "show_map_vma anchor not unique"
          s = s.replace(a1, helper + a1)

          i = s.index(a1)
          j = s.index("\ndone:\n", i)
          fn = s[i:j]

          a2 = "\tconst char *name = NULL;\n"
          assert fn.count(a2) == 1, "name decl anchor not unique"
          fn = fn.replace(a2, a2 + "\tstruct dentry *dentry = NULL;\n")

          a3 = ("\t}\n\n\tstart = vma->vm_start;\n\tend = vma->vm_end;\n"
                "\tshow_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);\n")
          assert fn.count(a3) == 1, "header-prefix anchor not unique"
          blk = (
              "\t\tdentry = file->f_path.dentry;\n"
              "\t\tif (dentry) {\n"
              "\t\t\tconst char *path = (const char *)dentry->d_name.name;\n"
              "\t\t\tif (strstr(path, \"lineage\")) {\n"
              "\t\t\t\tstart = vma->vm_start;\n"
              "\t\t\t\tend = vma->vm_end;\n"
              "\t\t\t\tshow_vma_header_prefix(m, start, end, flags, pgoff, dev, ino);\n"
              "\t\t\t\tname = \"/system/framework/framework-res.apk\";\n"
              "\t\t\t\tgoto done;\n"
              "\t\t\t}\n"
              "\t\t\tif (strstr(path, \"jit-zygote-cache\")) {\n"
              "\t\t\t\tstart = vma->vm_start;\n"
              "\t\t\t\tend = vma->vm_end;\n"
              "\t\t\t\tshow_vma_header_prefix_fake(m, start, end, flags, pgoff, dev, ino);\n"
              "\t\t\t\tgoto bypass;\n"
              "\t\t\t}\n"
              "\t\t}\n"
          )
          fn = fn.replace(a3, blk + a3 + "\nbypass:\n")
          s = s[:i] + fn + s[j:]
          open(p, "w").write(s)
          print("hide_stuff task_mmu.c merged (susfs-aware)")
          PY

          echo "=== hide_stuff verification (show_map_vma) ==="
          grep -n "struct dentry \*dentry = NULL;\|goto bypass;\|^bypass:\|show_vma_header_prefix_fake" fs/proc/task_mmu.c | head -n 8
          if grep -q "struct dentry \*dentry;" fs/proc/task_mmu.c; then
            echo "::error::uninitialized dentry declaration still present in task_mmu.c"; exit 1
          fi
          echo "完成"

      - name: Apply LZ4KD
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
            echo "正在打lz4kd补丁"
            patch -p1 -F 3 < lz4kd.patch || true
            echo '完成LZ4KD补丁'
          fi

      # 配置信息
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ github.event.inputs.KERNEL_VERSION }}"

          # SukiSU Ultra config
          grep -q "^CONFIG_KSU=" "$CONFIG_FILE" || echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

          # --- STEP 3: Kconfig symbol management (KPM + stale-symbol cleanup) ---
          # --- 3a. KPM (SukiSU Kernel Patch Module) ------------------------------------
          # Official SukiSU-Ultra requirement: CONFIG_KPM=y (KALLSYMS is already on in
          # GKI). The symbol only exists AFTER the SukiSU/KPM kernel patches have been
          # applied, so this must run after patching and before the build:
          if [ "${{ github.event.inputs.KPM }}" = "true" ]; then
            grep -q "^CONFIG_KPM=" "$CONFIG_FILE" || echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          fi

          # SUSFS config
          grep -q "^CONFIG_KSU_SUSFS=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SUS_PATH=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SUS_MOUNT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SUS_KSTAT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SUS_OVERLAYFS=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_TRY_UMOUNT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SPOOF_UNAME=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_ENABLE_LOG=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_KSU_SUSFS_OPEN_REDIRECT=" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # --- 3b. Remove stale SUSFS magic-mount symbol -------------------------------
          # SUSFS v1.5.2+ no longer defines CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT; leaving it
          # in the defconfig only produces kconfig warnings on every build:
          sed -i '/CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT/d' "$CONFIG_FILE"

          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

          # LZ4KD配置
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
              echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZO=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.12" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "5.10" ]; then
              if grep -q "CONFIG_ZSMALLOC" -- "$CONFIG_FILE"; then
                sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
              else
                echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              fi
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.12" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android16" ]; then
              if [  -e ./common/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
              fi

              if [  -e ./msm-kernel/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
                echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
                echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
              fi
              
              echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
              rm "common/android/gki_aarch64_modules"
              touch "common/android/gki_aarch64_modules"
            fi

            if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
              echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
            fi
          fi

          # =====================================================================
          # STEP 4: Performance configuration injection (verified 5.15 symbols ONLY)
          # Every symbol below exists in the Linux 5.15 Kconfig sources and in the
          # OnePlusOSS sm7550 tree. All echoes are guarded so re-runs are idempotent.
          # =====================================================================
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          # --- 4a. Network: BBR + FQ ----------------------------------------------------
          # TCP_CONG_BBR lives inside 'if TCP_CONG_ADVANCED' in 5.15 — the gate is
          # MANDATORY or kconfig silently drops BBR:
          grep -q "^CONFIG_TCP_CONG_ADVANCED=" "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_TCP_CONG_BBR="       "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_BBR=y"       >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_BBR="        "$CONFIG_FILE" || echo "CONFIG_DEFAULT_BBR=y"        >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_TCP_CONG="   "$CONFIG_FILE" || echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$CONFIG_FILE"
          # FQ pacing qdisc (already =y in this tree's gki_defconfig; kept as ensure):
          grep -q "^CONFIG_NET_SCH_FQ="         "$CONFIG_FILE" || echo "CONFIG_NET_SCH_FQ=y"         >> "$CONFIG_FILE"
          # Make FQ the system default qdisc (valid 5.15 symbols:
          # NET_SCH_DEFAULT + DEFAULT_FQ -> DEFAULT_NET_SCH="fq"):
          grep -q "^CONFIG_NET_SCH_DEFAULT="    "$CONFIG_FILE" || echo "CONFIG_NET_SCH_DEFAULT=y"    >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEFAULT_FQ="         "$CONFIG_FILE" || echo "CONFIG_DEFAULT_FQ=y"         >> "$CONFIG_FILE"
          # NOTE: there is NO ECN Kconfig symbol in 5.15 (CONFIG_IP_ECN is invalid).
          # ECN is unconditionally compiled and runtime-controlled via sysctl
          # net.ipv4.tcp_ecn. Do NOT echo any ECN config line.
          # Extra qdisc / diag bits (all valid 5.15 symbols, all guarded):
          grep -q "^CONFIG_NET_SCH_CAKE="       "$CONFIG_FILE" || echo "CONFIG_NET_SCH_CAKE=y"       >> "$CONFIG_FILE"
          grep -q "^CONFIG_TCP_CONG_CUBIC="     "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_CUBIC=y"     >> "$CONFIG_FILE"
          grep -q "^CONFIG_TCP_CONG_WESTWOOD="  "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_WESTWOOD=y"  >> "$CONFIG_FILE"

          # --- 4b. GPU devfreq (mainline governors only) --------------------------------
          # The Adreno-720 KGSL driver and the MSM_ADRENO_TZ governor are built from the
          # vendor modules side with stock fragments; CONFIG_MSM_KGSL /
          # CONFIG_DEVFREQ_GOV_MSM_ADRENO_TZ do not exist in the GKI kernel tree.
          # Ensure the mainline governors instead — SIMPLE_ONDEMAND is the one KGSL
          # falls back to and is missing from the tree's gki_defconfig:
          grep -q "^CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=" "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEVFREQ_GOV_PERFORMANCE="     "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y"     >> "$CONFIG_FILE"
          grep -q "^CONFIG_DEVFREQ_GOV_USERSPACE="       "$CONFIG_FILE" || echo "CONFIG_DEVFREQ_GOV_USERSPACE=y"       >> "$CONFIG_FILE"

          # --- 4c. ZRAM: default compressor (5.15-correct method) -----------------------
          # The 5.15 zram driver reads CONFIG_ZRAM_DEF_COMP from a real Kconfig choice.
          # Set LZ4 unless the LZ4KD workflow path already selected a choice member
          # (ZRAM_DEF_COMP is a choice — two members would just conflict):
          grep -q "^CONFIG_ZRAM="              "$CONFIG_FILE" || echo "CONFIG_ZRAM=y"              >> "$CONFIG_FILE"
          grep -q "^CONFIG_CRYPTO_LZ4="        "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4=y"        >> "$CONFIG_FILE"
          grep -q "^CONFIG_CRYPTO_LZ4HC="      "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4HC=y"      >> "$CONFIG_FILE"
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ] && grep -q "config ZRAM_DEF_COMP_LZ4KD" ./common/drivers/block/zram/Kconfig 2>/dev/null; then
            # LZ4KD build: the lz4kd.patch adds the LZ4KD choice member and makes it
            # the Kconfig default. Select it explicitly so an LZ4 selection can never
            # override it (choice = exactly one member wins):
            sed -i '/^CONFIG_ZRAM_DEF_COMP_LZ4=y/d' "$CONFIG_FILE"
            grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4KD=" "$CONFIG_FILE" || echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
          elif ! grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4KD=y" "$CONFIG_FILE"; then
            grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4=" "$CONFIG_FILE" || echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> "$CONFIG_FILE"
          fi
          grep -q "^CONFIG_ZRAM_WRITEBACK="    "$CONFIG_FILE" || echo "CONFIG_ZRAM_WRITEBACK=y"    >> "$CONFIG_FILE"

          # --- 4d. Scheduler: utilization clamping --------------------------------------
          # Already =y in this tree's gki_defconfig; kept as idempotent ensures:
          grep -q "^CONFIG_UCLAMP_TASK="       "$CONFIG_FILE" || echo "CONFIG_UCLAMP_TASK=y"       >> "$CONFIG_FILE"
          grep -q "^CONFIG_UCLAMP_TASK_GROUP=" "$CONFIG_FILE" || echo "CONFIG_UCLAMP_TASK_GROUP=y" >> "$CONFIG_FILE"

          # --- 4e. I/O scheduler ---------------------------------------------------------
          # Valid 5.15 symbol (mainline default y); coexists with the tree's BFQ:
          grep -q "^CONFIG_MQ_IOSCHED_KYBER="  "$CONFIG_FILE" || echo "CONFIG_MQ_IOSCHED_KYBER=y" >> "$CONFIG_FILE"

          # --- 4f. Compiler / allocator ---------------------------------------------------
          # This tree's gki_defconfig pins CONFIG_LTO_CLANG_FULL=y. LTO level is a
          # Kconfig choice, so DELETE FULL before appending THIN (large CI speedup):
          sed -i '/^CONFIG_LTO_CLANG_FULL=y/d' "$CONFIG_FILE"
          grep -q "^CONFIG_LTO_CLANG_THIN="    "$CONFIG_FILE" || echo "CONFIG_LTO_CLANG_THIN=y"   >> "$CONFIG_FILE"
          # SLUB debug support off (valid 5.15 symbol; the runtime slub_debug= param
          # then becomes a no-op, which is the intent):
          grep -q "^CONFIG_SLUB_DEBUG="        "$CONFIG_FILE" || echo "CONFIG_SLUB_DEBUG=n"       >> "$CONFIG_FILE"
          # DEBUG_INFO: the tree base sets DEBUG_INFO=y + DWARF4 + DEBUG_INFO_BTF=y and
          # the oplus fragment already adds DEBUG_INFO_REDUCED=y. Turning DEBUG_INFO off
          # also kills BTF, which breaks the Android bpfloader / tethering offload on
          # Android 13+ ROMs. RECOMMENDED: leave debug info untouched (the flashable
          # Image contains no DWARF anyway — only vmlinux and .ko files do).
          # Only if you explicitly accept the bpfloader risk, uncomment the next line:
          # sed -i '/^CONFIG_DEBUG_INFO=y/d;/^CONFIG_DEBUG_INFO_DWARF4=y/d;/^CONFIG_DEBUG_INFO_BTF=y/d' "$CONFIG_FILE" && echo "# CONFIG_DEBUG_INFO is not set" >> "$CONFIG_FILE"
          # NTSYNC: does NOT exist in 5.15 (merged upstream in 6.7 under drivers/misc).
          # Only meaningful for Wine/Winlator users and only after an explicit backport
          # of the ntsync driver into this tree. Guarded no-op otherwise:
          if [ -d ./common/drivers/misc/ntsync ] || [ -d ./common/fs/ntsync ]; then
            grep -q "^CONFIG_NTSYNC=" "$CONFIG_FILE" || echo "CONFIG_NTSYNC=y" >> "$CONFIG_FILE"
          fi

          # =====================================================================
          # STEP 4g: Network *parameter* tuning (source-level sysctl defaults)
          # These are NOT Kconfig symbols; they are the per-netns defaults set in
          # tcp_sk_init() (net/ipv4/tcp_ipv4.c) and net/core/dev.c. Android's
          # init.rc only writes rmem_max/wmem_max/ping_group_range/fwmark bits,
          # so these kernel defaults are what the device actually runs with.
          # Every sed matches the exact 5.15 line verified in the OnePlusOSS
          # sm7550 tree and is idempotent (re-running changes nothing). If a
          # pattern is missing on a different tree, the sed is a no-op and the
          # audit block below reports it.
          # =====================================================================
          TCP_SRC=./common/net/ipv4/tcp_ipv4.c
          DEV_SRC=./common/net/core/dev.c
          if [ -f "$TCP_SRC" ]; then
            # ECN: 2 = respond only -> 1 = request+respond (pairs with BBR/fq; the
            # tree already keeps tcp_ecn_fallback=1 so broken paths degrade safely)
            sed -i 's/net->ipv4\.sysctl_tcp_ecn = 2;/net->ipv4.sysctl_tcp_ecn = 1;/' "$TCP_SRC"
            # TFO: client-only -> client + server (bit0|bit1 = 3)
            sed -i 's/net->ipv4\.sysctl_tcp_fastopen = TFO_CLIENT_ENABLE;/net->ipv4.sysctl_tcp_fastopen = TFO_CLIENT_ENABLE | TFO_SERVER_ENABLE;/' "$TCP_SRC"
            # Do not collapse cwnd after idle on mobile links (RFC2861 off); the
            # radio's own idle timer already gates this.
            sed -i 's|net->ipv4\.sysctl_tcp_slow_start_after_idle = 1; /\* By default, RFC2861 behavior\.  \*/|net->ipv4.sysctl_tcp_slow_start_after_idle = 0; /* mobile: keep cwnd across idle */|' "$TCP_SRC"
            # PMTU blackhole detection (0 -> 1 = probe only after ICMP blackhole)
            if grep -q "net->ipv4\.sysctl_tcp_mtu_probing = " "$TCP_SRC"; then
              sed -i 's/net->ipv4\.sysctl_tcp_mtu_probing = [0-9];/net->ipv4.sysctl_tcp_mtu_probing = 1;/' "$TCP_SRC"
            else
              sed -i 's/\(net->ipv4\.sysctl_tcp_ecn_fallback = 1;\)/\1\n\tnet->ipv4.sysctl_tcp_mtu_probing = 1;/' "$TCP_SRC"
            fi
            # RFC1337 TIME-WAIT assassination protection (0 -> 1)
            if grep -q "net->ipv4\.sysctl_tcp_rfc1337 = " "$TCP_SRC"; then
              sed -i 's/net->ipv4\.sysctl_tcp_rfc1337 = [0-9];/net->ipv4.sysctl_tcp_rfc1337 = 1;/' "$TCP_SRC"
            else
              sed -i 's/\(net->ipv4\.sysctl_tcp_ecn_fallback = 1;\)/\1\n\tnet->ipv4.sysctl_tcp_rfc1337 = 1;/' "$TCP_SRC"
            fi
            # Lower notsent_lowat (UINT_MAX -> 128 KiB) to cut bufferbloat / HoL on
            # interactive flows; recommended alongside BBR by the BBR authors.
            sed -i 's/net->ipv4\.sysctl_tcp_notsent_lowat = UINT_MAX;/net->ipv4.sysctl_tcp_notsent_lowat = 131072;/' "$TCP_SRC"
            # Keepalive: 2h -> 5min so NAT/carrier-CGN mappings do not silently die
            sed -i 's/net->ipv4\.sysctl_tcp_keepalive_time = TCP_KEEPALIVE_TIME;/net->ipv4.sysctl_tcp_keepalive_time = 5*60*HZ;/' "$TCP_SRC"
            # FIN_WAIT2 timeout: 60s -> 30s (faster socket reclaim on flaky radios)
            sed -i 's/net->ipv4\.sysctl_tcp_fin_timeout = TCP_FIN_TIMEOUT;/net->ipv4.sysctl_tcp_fin_timeout = 30*HZ;/' "$TCP_SRC"
          else
            echo "::warning::$TCP_SRC not found - skipping TCP sysctl default tuning"
          fi
          if [ -f "$DEV_SRC" ]; then
            # Softirq backlog for high-throughput Wi-Fi 6/6E + 5G: 1000 -> 2500,
            # NAPI budget 300 -> 600 packets per poll.
            sed -i 's/^int netdev_max_backlog __read_mostly = 1000;/int netdev_max_backlog __read_mostly = 2500;/' "$DEV_SRC"
            sed -i 's/^int netdev_budget __read_mostly = 300;/int netdev_budget __read_mostly = 600;/' "$DEV_SRC"
          else
            echo "::warning::$DEV_SRC not found - skipping netdev backlog tuning"
          fi

          echo "=== Network sysctl default audit (source-level) ==="
          grep -nE "sysctl_tcp_ecn = |sysctl_tcp_fastopen = |slow_start_after_idle = |sysctl_tcp_mtu_probing = |sysctl_tcp_rfc1337 = |sysctl_tcp_notsent_lowat = |sysctl_tcp_keepalive_time = |sysctl_tcp_fin_timeout = " "$TCP_SRC" || true
          grep -nE "^int netdev_max_backlog|^int netdev_budget " "$DEV_SRC" || true

          echo "=== Injected defconfig tail (audit) ==="
          grep -nE "CONFIG_KPM|CONFIG_TCP_CONG|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ|CONFIG_NET_SCH_CAKE|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEVFREQ_GOV|CONFIG_ZRAM|CONFIG_CRYPTO_LZ4|CONFIG_UCLAMP|CONFIG_MQ_IOSCHED_KYBER|CONFIG_LTO_CLANG|CONFIG_SLUB_DEBUG|CONFIG_NTSYNC" "$CONFIG_FILE" || true

      - name: Build kernel
        if: ${{ github.event.inputs.CPU == 'sm8650' || github.event.inputs.CPU == 'sm7675' }}
        run: |
          # STEP 2: GitHub Actions' default `bash -e {0}` does NOT enable pipefail.
          # Without it `... 2>&1 | tee build.log` returns tee's exit code (0) and
          # the job reports success on a dead build. Make the pipeline fail through.
          set -o pipefail
          cd kernel_workspace
          ./kernel_platform/build_with_bazel.py -t ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }} 2>&1 | tee build.log

      - name: Fallback build kernel
        if: ${{ github.event.inputs.CPU != 'sm8650' && github.event.inputs.CPU != 'sm7675' }}
        run: |
          # STEP 2: GitHub Actions' default `bash -e {0}` does NOT enable pipefail.
          # Without it `... 2>&1 | tee build.log` returns tee's exit code (0) and
          # the job reports success on a dead build. Make the pipeline fail through.
          set -o pipefail
          cd kernel_workspace
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }} 2>&1 | tee build.log

          # oplus_build_kernel.sh's interactive menu swallows non-zero exit codes in
          # some paths (the failed run above logged 'make ... Error 2' and still
          # printed the 'build total time' banner). Fail explicitly on compiler errors
          # so a dead build never reaches packaging:
          if grep -qE "^(source/)?[A-Za-z0-9_./-]+\.[ch]:[0-9]+:[0-9]+: error:|\*\*\* \[.*\] Error [0-9]+" build.log; then
            echo "::error::Kernel compilation errors detected in build.log — failing the job."
            grep -nE "error:|\*\*\* \[.*\] Error [0-9]+" build.log | head -n 40
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          # STEP 5: dynamic Image discovery. Never hardcode an out-dir path: the
          # oplus build script silently remaps unknown CPUD values (e.g. crow ->
          # "auto select platform kalama"), so out/msm-kernel-<CPUD>-<method> may
          # not exist even after a successful build.
          IMAGE_SRC=""
          # Tier 1: bazel/kleaf dist directories (the normal oplus kernel_platform layout)
          IMAGE_SRC=$(find kernel_workspace/kernel_platform/out -type f -name Image -path "*dist*" 2>/dev/null | head -n 1)
          # Tier 2: anywhere under the kernel_platform out/ tree
          if [ -z "$IMAGE_SRC" ]; then
            IMAGE_SRC=$(find kernel_workspace/kernel_platform/out -type f -name Image 2>/dev/null | head -n 1)
          fi
          # Tier 3: classic OBJ layout anywhere in the workspace
          if [ -z "$IMAGE_SRC" ]; then
            IMAGE_SRC=$(find kernel_workspace -type f -name Image -path "*arm64/boot*" 2>/dev/null | head -n 1)
          fi

          if [ -n "$IMAGE_SRC" ] && [ -s "$IMAGE_SRC" ]; then
            cp "$IMAGE_SRC" ./AnyKernel3/Image
            echo "Successfully found and copied kernel Image from: $IMAGE_SRC ($(du -h "$IMAGE_SRC" | cut -f1))"
          else
            echo "ERROR: Kernel Image binary not found in any out/ tree! Failing the job instead of shipping an empty zip."
            exit 1
          fi

          # Export the discovered dist directory for later steps (KPM patch_linux, audit)
          DIST_DIR="$(dirname "$IMAGE_SRC")"
          echo "IMAGE_SRC=$IMAGE_SRC" >> $GITHUB_ENV
          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

          # 可选复制其它新文件（如果存在）
          if [ "${{ github.event.inputs.CPU }}" = "sm8750" ] || [ "${{ github.event.inputs.CPU }}" = "sm8850" ]; then
          for file in dtbo.img system_dlkm.erofs.img vendor_dlkm.img vendor_boot.img; do
            if [ -f "$DIST_DIR/$file" ]; then
              target_name="$file"
              # 特殊处理 system_dlkm.erofs.img 的目标名
              if [ "$file" = "system_dlkm.erofs.img" ]; then
                target_name="system_dlkm.img"
              fi
              cp "$DIST_DIR/$file" "./AnyKernel3/$target_name"
            else
              echo "$file 不存在，跳过复制"
            fi
          done
          fi

      - name: Apply patch_linux and replace Image
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          # Use the dist directory discovered dynamically in "Make AnyKernel3"
          # (no hardcoded kalama/crow path, no hardcoded runner workspace path).
          if [ -z "$DIST_DIR" ] || [ ! -f "$DIST_DIR/Image" ]; then
            echo "ERROR: DIST_DIR not set or Image missing (DIST_DIR='$DIST_DIR')"
            exit 1
          fi
          cd "$DIST_DIR"

          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          if [ ! -s oImage ]; then
            echo "ERROR: patch_linux did not produce oImage"
            exit 1
          fi
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image
          echo "KPM-patched Image installed ($(du -h Image | cut -f1))"

      # 下载 SUSFS 模块（CI）
      - name: Download SUSFS Module (CI with Release fallback)
        run: |
          set -o pipefail
          # STEP 6: one canonical filename for the CI artifact AND the release
          # asset. The AnyKernel3 flasher (Numbersf/AnyKernel3 anykernel.sh)
          # looks for ksu_module_susfs_1.5.2+_CI.zip / _Release.zip, so we ship
          # the canonical name plus the exact name the flasher expects.
          OUT=ksu_module_susfs.zip
          FLASHER_NAME=""
          rm -f "$OUT"

          if [ "${{ github.event.inputs.SUSFS_CI }}" = "true" ]; then
            echo "Trying latest CI artifact from sidex15/susfs4ksu-module (branch v1.5.2+)..."
            LATEST_RUN_ID=$(curl -fsS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success&per_page=30" | \
              jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1 || true)
            if [ -n "$LATEST_RUN_ID" ]; then
              ARTIFACT_URL=$(curl -fsS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | \
                jq -r '.artifacts[] | select(.expired == false) | .archive_download_url' | head -n 1 || true)
              if [ -n "$ARTIFACT_URL" ] && [ "$ARTIFACT_URL" != "null" ]; then
                # GITHUB_TOKEN is repo-scoped; cross-repo artifact download may 403.
                curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o "$OUT" "$ARTIFACT_URL" || rm -f "$OUT"
              fi
            fi
            if [ -s "$OUT" ] && unzip -tq "$OUT" >/dev/null 2>&1 && unzip -p "$OUT" module.prop >/dev/null 2>&1; then
              echo "CI artifact OK (run $LATEST_RUN_ID)"; FLASHER_NAME="ksu_module_susfs_1.5.2+_CI.zip"
            else
              echo "::warning::CI artifact unavailable or invalid - falling back to GitHub Release"
              rm -f "$OUT"
            fi
          fi

          if [ ! -s "$OUT" ]; then
            echo "Downloading latest release from sidex15/ksu_module_susfs..."
            curl -fsSL -o "$OUT" "https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip"
            unzip -tq "$OUT" >/dev/null && unzip -p "$OUT" module.prop >/dev/null || { echo "::error::Release zip invalid"; exit 1; }
            FLASHER_NAME="ksu_module_susfs_1.5.2+_Release.zip"
          fi

          cp "$OUT" ./AnyKernel3/"$OUT"
          cp "$OUT" ./AnyKernel3/"$FLASHER_NAME"
          echo "SUSFS module shipped as: $OUT and $FLASHER_NAME ($(du -h "$OUT" | cut -f1))"

      # STEP 7: post-build verification of the config the build actually consumed
      - name: Verify applied kernel config
        run: |
          OUT_CONFIG=$(find kernel_workspace/kernel_platform/out -name ".config" -path "*msm-kernel*" 2>/dev/null | head -n 1)
          if [ -z "$OUT_CONFIG" ]; then
            OUT_CONFIG=$(find kernel_workspace/kernel_platform/out -name ".config" 2>/dev/null | head -n 1)
          fi
          if [ -n "$OUT_CONFIG" ]; then
            echo "Auditing: $OUT_CONFIG"
            echo "=== Applied config audit ==="
            grep -E "CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ|CONFIG_DEFAULT_NET_SCH|CONFIG_ZRAM_DEF_COMP|CONFIG_UCLAMP_TASK|CONFIG_MQ_IOSCHED_KYBER|CONFIG_LTO_CLANG|CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND|CONFIG_SLUB_DEBUG" "$OUT_CONFIG" || true
            echo "=== KSU / SUSFS state ==="
            grep -E "^CONFIG_KSU" "$OUT_CONFIG" || echo "WARNING: no CONFIG_KSU symbols in .config"
            echo "=== KPM state ==="
            grep -E "CONFIG_KPM" "$OUT_CONFIG" || echo "KPM not enabled (input off or symbol absent)"
          else
            echo "No .config found under kernel_platform/out — skipping audit"
          fi
          echo "=== AnyKernel3 payload ==="
          ls -la ./AnyKernel3/

      - name: Set suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.KPM == 'true' && '_KPM' || '' }}${{ github.event.inputs.VFS == 'true' && '_VFS' || '' }}${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}" >> $GITHUB_OUTPUT

      - name: Remove _uv suffix from FEIL
        id: feil_clean
        run: |
          clean_feil="${{ github.event.inputs.FEIL }}"
          clean_feil="${clean_feil%_v}"  # 去掉结尾的 _v（如果有）
          clean_feil="${clean_feil%_u}"  # 去掉结尾的 _u（如果有）
          echo "value=$clean_feil" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.feil_clean.outputs.value }}${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
